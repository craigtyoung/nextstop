<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextStop — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF4EA;
    --ink: #2B261F;
    --ink-soft: #5B5346;
    --orange: #E35B2E;
    --sky: #2F7A96;
    --sky-soft: #BFE0EA;
    --sage: #7C8B5E;
    --sage-soft: #D9E2C6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--sky-soft);
    background: radial-gradient(circle at 30% 20%, #D7ECE9, var(--sky-soft) 60%);
    color: var(--ink);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .back {
    position: fixed;
    top: 24px; left: 28px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.7);
    padding: 9px 16px;
    border-radius: 100px;
    backdrop-filter: blur(6px);
  }
  .demo-label {
    text-align: center;
    margin-bottom: 26px;
  }
  .demo-label .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--sky);
    margin-bottom: 8px;
  }
  .demo-label h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
  }
  .demo-label p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

  .phone-frame {
    position: relative;
    width: 320px;
    height: 650px;
    background: var(--ink);
    border-radius: 48px;
    padding: 14px;
    box-shadow: 0 50px 80px -24px rgba(43,38,31,0.5), 0 0 0 2px rgba(43,38,31,0.06);
  }
  .phone-notch {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 128px; height: 28px;
    background: var(--ink);
    border-radius: 0 0 18px 18px;
    z-index: 5;
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    background: var(--cream);
    border-radius: 36px;
    overflow: hidden;
    padding: 46px 22px 26px;
    display: flex;
    flex-direction: column;
  }
  .app-status { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 28px; }
  .app-location { color: var(--sky); }
  .app-eyebrow {
    display: inline-block; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--orange);
    margin-bottom: 8px;
    transition: opacity 0.2s ease;
  }
  .app-greeting h3 {
    font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; line-height: 1.1;
    margin-bottom: 24px;
  }
  .app-moods { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .mood {
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 100px;
    background: #fff; border: 1.5px solid rgba(43,38,31,0.1); color: var(--ink-soft);
    cursor: pointer; transition: all 0.2s ease;
  }
  .mood:hover { border-color: var(--orange); }
  .mood.active { background: var(--orange); color: #fff; border-color: var(--orange); }

  .app-card {
    background: #fff; border-radius: 20px; padding: 20px;
    box-shadow: 0 10px 24px -14px rgba(43,38,31,0.3);
    margin-bottom: 14px;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .app-card.swap { opacity: 0; transform: translateY(8px); }
  .app-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: #4B5636; background: var(--sage-soft); padding: 4px 11px; border-radius: 100px;
  }
  .app-card h4 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; margin: 11px 0 6px; }
  .app-card p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .app-cta {
    margin-top: 13px; font-size: 13px; font-weight: 600; color: var(--orange);
    cursor: pointer; display: inline-block;
  }
  .app-card.ghost { opacity: 0.5; padding: 15px 20px; margin-bottom: 0; }
  .app-card.ghost h4 { font-size: 16px; margin-top: 6px; }

  .swipe-hint {
    font-size: 11.5px; font-weight: 600; color: var(--ink-soft);
    opacity: 0.6; margin-bottom: 10px;
  }
  .card-row {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    transition: opacity 0.15s ease;
    padding-bottom: 8px;
    margin: 0 -22px;
    padding-left: 22px;
    padding-right: 22px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .card-row::-webkit-scrollbar { display: none; }
  .card-row .app-card {
    flex: 0 0 auto;
    width: 210px;
    scroll-snap-align: start;
    margin-bottom: 0;
    cursor: default;
  }
  .card-row .app-card:first-child { border: 1.5px solid var(--orange); }

  .phone-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(43,38,31,0.08);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; opacity: 0.55; transition: opacity 0.2s ease, color 0.2s ease;
  }
  .nav-item .nav-icon { font-size: 19px; line-height: 1; }
  .nav-item.active { opacity: 1; color: var(--orange); }

  .toast {
    position: fixed;
    bottom: 36px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--cream);
    padding: 13px 22px; border-radius: 100px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.3s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .phone-home {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 128px; height: 5px; border-radius: 4px; background: rgba(250,244,234,0.5);
  }

  /* On an actual phone, go full-bleed, drop the bezel */
  @media (max-width: 440px) {
    body { padding: 0; }
    .back { background: rgba(255,255,255,0.85); }
    .demo-label { display: none; }
    .phone-frame {
      width: 100vw; height: 100dvh;
      border-radius: 0; padding: 0; box-shadow: none;
    }
    .phone-notch { display: none; }
    .phone-screen { border-radius: 0; padding: 30px 22px 24px; }
    .phone-home { display: none; }
  }
</style>
</head>
<body>

<a class="back" href="index.html">← NextStop</a>

<div class="demo-label">
  <div class="eyebrow">Live demo</div>
  <h1>Tap a mood. See it work.</h1>
  <p>This is the actual screen — not a screenshot.</p>
</div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen">
    <div class="app-status">
      <span>9:41</span>
      <span class="app-location">📍 Lisbon, Portugal</span>
    </div>
    <div class="app-greeting">
      <span class="app-eyebrow" id="countdown">3h 20m until check-in</span>
      <h3>What's your<br>next move?</h3>
    </div>
    <div class="app-moods" id="moods">
      <span class="mood active" data-mood="explore">Explore</span>
      <span class="mood" data-mood="relax">Relax</span>
      <span class="mood" data-mood="eat">Eat</span>
      <span class="mood" data-mood="move">Move</span>
    </div>
    <div class="swipe-hint">Swipe for more →</div>
    <div class="card-row" id="cardRow"></div>

    <div class="phone-nav">
      <div class="nav-item active" data-nav="next"><span class="nav-icon">🧭</span>Next Move</div>
      <div class="nav-item" data-nav="trip"><span class="nav-icon">✈️</span>Trip</div>
      <div class="nav-item" data-nav="saved"><span class="nav-icon">🔖</span>Saved</div>
      <div class="nav-item" data-nav="profile"><span class="nav-icon">👤</span>Profile</div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<div class="toast" id="toast">Opening Maps…</div>

<script>
  const data = {
    explore: [
      { tag: "8 min walk", title: "Miradouro da Graça", desc: "Quiet viewpoint, locals' spot, best light right now." },
      { tag: "15 min walk", title: "Feira da Ladra market", desc: "Sunday flea market — vintage finds and street food." },
      { tag: "5 min walk", title: "Alfama backstreets", desc: "Get lost on purpose. Tiled facades, fado drifting from doorways." }
    ],
    relax: [
      { tag: "6 min walk", title: "Jardim do Príncipe Real", desc: "Shaded benches under an old cedar — the calmest spot in the neighborhood." },
      { tag: "12 min walk", title: "Rooftop café, Bairro Alto", desc: "River views, slow coffee, no rush." },
      { tag: "20 min walk", title: "Thermal bath house", desc: "Honestly the best place to just stop moving for an hour." }
    ],
    eat: [
      { tag: "5 min walk", title: "Manteigaria", desc: "Fresh pastel de nata, straight out of the oven, no line this hour." },
      { tag: "18 min walk", title: "Time Out Market", desc: "Dozens of stalls under one roof — pick anything." },
      { tag: "14 min walk", title: "Cervejaria Ramiro", desc: "Seafood institution. Go hungry." }
    ],
    move: [
      { tag: "3 min to the stop", title: "Tram 28 down to the river", desc: "The classic yellow tram — grab a window seat, ride it to the end." },
      { tag: "10 min walk", title: "Walk the river promenade", desc: "Flat, scenic, easy pace." },
      { tag: "7 min walk", title: "Miradouro stair climb", desc: "Short, steep, worth it for the view at the top." }
    ]
  };

  const moods = document.querySelectorAll('.mood');
  const cardRow = document.getElementById('cardRow');
  const toast = document.getElementById('toast');

  function renderCards(moodKey) {
    cardRow.innerHTML = '';
    data[moodKey].forEach(place => {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.innerHTML = `
        <span class="app-tag">${place.tag}</span>
        <h4>${place.title}</h4>
        <p>${place.desc}</p>
        <div class="app-cta">Get directions →</div>
      `;
      card.querySelector('.app-cta').addEventListener('click', () => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
      });
      cardRow.appendChild(card);
    });
  }

  moods.forEach(m => {
    m.addEventListener('click', () => {
      moods.forEach(x => x.classList.remove('active'));
      m.classList.add('active');
      cardRow.style.opacity = 0;
      setTimeout(() => {
        renderCards(m.dataset.mood);
        cardRow.style.opacity = 1;
      }, 150);
    });
  });

  // Bottom nav is a visual preview only — not wired to real screens yet
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
    });
  });

  renderCards('explore');
</script>

</body>
</html>
